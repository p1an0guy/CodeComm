name: phase-1

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Go ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version: "1.26.x"
          cache: true
      - name: Test
        if: runner.os != 'Windows'
        env:
          CODECOMM_REQUIRE_DAEMON_MESH: "1"
        # Bound both package processes and same-process SQLite pools. The mesh
        # remains concurrent internally but is not starved by every package.
        run: go test -p 2 -parallel 2 -timeout 20m ./...
      - name: Test
        if: runner.os == 'Windows'
        env:
          CODECOMM_REQUIRE_DAEMON_MESH: "1"
        shell: pwsh
        run: ./.github/scripts/run-windows-tests.ps1
      - name: Vet
        run: go vet ./...
      - name: Staticcheck
        if: runner.os == 'Linux'
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 ./...
      - name: Verify modules
        run: go mod verify

  race-packages:
    name: Race detector / ${{ matrix.group }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        group:
          - daemon
          - consensus
          - store
          - other
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version: "1.26.x"
          cache: true
      - name: Race ${{ matrix.group }} packages
        shell: bash
        env:
          CODECOMM_TEST_TIMEOUT_PROFILE: instrumented
        run: |
          case "${{ matrix.group }}" in
            daemon)
              go test -race -p 1 -parallel 2 -timeout 20m \
                -skip '^(TestDaemonProductionMeshComposition|TestDaemonSettledAutomaticLogicalSnapshotFallbackPersistsAcrossRestart)$' \
                ./cmd/codecommd
              ;;
            consensus)
              go test -race -p 1 -parallel 2 -timeout 20m \
                ./internal/consensus
              ;;
            store)
              go test -race -p 1 -parallel 2 -timeout 20m \
                ./internal/store
              ;;
            other)
              mapfile -t packages < <(
                go list ./... |
                  grep -Ev '/(cmd/codecommd|internal/consensus|internal/store)$'
              )
              go test -race -p 1 -parallel 2 -timeout 20m \
                "${packages[@]}"
              ;;
            *)
              exit 2
              ;;
          esac

  race:
    name: Race detector
    runs-on: ubuntu-latest
    if: always()
    needs:
      - race-packages
    steps:
      - name: Require every race package group
        env:
          RACE_RESULT: ${{ needs.race-packages.result }}
        run: test "$RACE_RESULT" = success

  native-multicast:
    name: Native multicast ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # GitHub-hosted macOS has no multicast route. Physical-LAN macOS
        # coverage requires the two-host acceptance gate specified in the
        # test strategy; local-origin loopback is not equivalent.
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version: "1.26.x"
          cache: true
      - name: Require same-port multicast exchange
        env:
          CODECOMM_REQUIRE_NATIVE_MULTICAST: "1"
        run: go test -count=1 -run "^TestMulticastNativeIntegration$" ./internal/discovery

  phase3-mesh-coverage:
    name: Phase 3 secure-mesh coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version: "1.26.x"
          cache: true
      - name: Exercise mesh in process
        env:
          GODEBUG: http2xconnect=1
          CODECOMM_SECURE_MESH_IN_PROCESS: "1"
        shell: bash
        run: |
          go test -count=1 -covermode=atomic \
            -coverpkg=./internal/consensus,./internal/transport \
            -coverprofile="$RUNNER_TEMP/phase3-mesh.cover" \
            ./internal/consensus \
            -run '^(TestSecureThreeVoterConsensusMesh|TestSecureThreeVoterColdCommitRecovery|TestSecureMeshVoterReconciliationTransitions|TestSecureMeshIsolatedMinorityCannotEscalate|TestSecureMeshFollowerForwardsOnlyToObservedLeader|TestSecureMeshCompactedSnapshotCatchupAndPromotion)$'
          go tool cover -func="$RUNNER_TEMP/phase3-mesh.cover" \
            | tee "$RUNNER_TEMP/phase3-mesh-coverage.txt"
          total="$(awk '/^total:/ {gsub(/%/, "", $3); print $3}' "$RUNNER_TEMP/phase3-mesh-coverage.txt")"
          awk -v total="$total" 'BEGIN { if (total + 0 < 45) exit 1 }'

  phase3-multi-agent:
    name: Phase 3 multi-agent latency
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version: "1.26.x"
          cache: true
      - name: Enforce same-device visibility
        env:
          CODECOMM_PHASE3_MULTI_AGENT: "1"
          CODECOMM_REQUIRE_DAEMON_MESH: "1"
          CODECOMM_TEST_DAEMON_MESH_CHILD: "1"
          GODEBUG: http2xconnect=1
        run: >-
          go test -count=1 -timeout 8m -v
          -run "^TestDaemonSameDeviceVisibilityLatency$"
          ./cmd/codecommd

  stable-store-syscall:
    name: Stable-store sync ordering
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version: "1.26.x"
          cache: true
      - name: Build stable-store probe
        run: go test -c -o "$RUNNER_TEMP/raftprobe.test" ./spikes/phase1/raftprobe
      - name: Trace StoreLogs acknowledgement
        run: |
          # Trace by syscall class, not an enumerated list: `pwrite` is not a
          # valid name on x86-64 (only pwrite64 exists), and naming a syscall the
          # running kernel lacks makes strace exit before tracing anything. The
          # %desc class covers every descriptor operation on every architecture;
          # the verifier filters to the writes and syncs it needs.
          strace -f -qq -e trace=%desc \
            -o "$RUNNER_TEMP/codecomm-store-trace" \
            "$RUNNER_TEMP/raftprobe.test" \
            -test.run='^TestSynchronousStableStoreSurvivesProcessKillAfterAcknowledgement$' \
            -test.count=1
          go run ./spikes/phase1/raftprobe/cmd/verify-fsync-trace \
            "$RUNNER_TEMP"/codecomm-store-trace*

  fuzz-smoke:
    name: JCS fuzz smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version: "1.26.x"
          cache: true
      - run: go test ./internal/codec -run=^$ -fuzz=FuzzCanonicalizeDifferential -fuzztime=30s
      - run: go test ./internal/codec -run=^$ -fuzz=FuzzCanonicalizeIntegerProfile -fuzztime=30s

  vulnerability-scan:
    name: Go vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version: "1.26.x"
          cache: true
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 -test ./...
