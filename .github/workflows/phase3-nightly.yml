name: phase-3-nightly

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase-3-nightly
  cancel-in-progress: false

jobs:
  leader-replacement:
    name: Leader replacement p95
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version: "1.26.x"
          cache: true
      - name: Enforce leader-replacement target
        env:
          CODECOMM_PHASE3_PERFORMANCE: "1"
        run: >-
          go test -count=1 -timeout 5m -v
          -run "^TestSecureMeshLeaderReplacementLatency$"
          ./internal/consensus

  coordination-visibility:
    name: Coordination visibility regression p95
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version: "1.26.x"
          cache: true
      - name: Enforce coordination-visibility target
        env:
          CODECOMM_PHASE3_PERFORMANCE: "1"
          CODECOMM_REQUIRE_DAEMON_MESH: "1"
          CODECOMM_TEST_DAEMON_MESH_CHILD: "1"
          GODEBUG: http2xconnect=1
        run: >-
          go test -count=1 -timeout 8m -v
          -run "^TestDaemonCoordinationVisibilityLatency$"
          ./cmd/codecommd

  coordination-growth:
    name: Durable 10k coordination growth
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version: "1.26.x"
          cache: true
      - name: Enforce frozen 10k-event budget
        env:
          CODECOMM_PHASE3_PERFORMANCE: "1"
        run: >-
          go test -count=1 -timeout 35m -v
          -run "^TestCoordinationGrowthBudget$"
          ./internal/phase3bench
