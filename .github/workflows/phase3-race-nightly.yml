name: phase-3-instrumented-race

on:
  schedule:
    - cron: "41 10 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase-3-instrumented-race
  cancel-in-progress: false

jobs:
  extended-daemon-race:
    name: Extended daemon race / ${{ matrix.scenario }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - scenario: production-mesh
            test: TestDaemonProductionMeshComposition
          - scenario: settled-snapshot
            test: TestDaemonSettledAutomaticLogicalSnapshotFallbackPersistsAcrossRestart
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version: "1.26.x"
          cache: true
      - name: Run instrumented scenario
        env:
          CODECOMM_REQUIRE_DAEMON_MESH: "1"
          CODECOMM_TEST_TIMEOUT_PROFILE: instrumented
          GODEBUG: http2xconnect=1
        run: >-
          go test -race -count=1 -timeout 35m -v
          -run "^${{ matrix.test }}$"
          ./cmd/codecommd
